services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: notifuser_test
      POSTGRES_PASSWORD: notifpass_test
      POSTGRES_DB: notifdb_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U notifuser_test -d notifdb_test" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    command: pytest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_NO_DEV: 0 # dev dependencies will be installed by uv
    environment:
      - JWT_SECRET=randomsecret12345678901234567890
      - DB_CONNECTION_STRING=postgresql+psycopg://notifuser_test:notifpass_test@postgres:5432/notifdb_test
    ports:
      - "8000:8000"

volumes:
  postgres_data_test:
