services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: notifuser
      POSTGRES_PASSWORD: notifpass
      POSTGRES_DB: notifdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_test:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U notifuser -d notifdb" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    command: pytest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - JWT_SECRET=randomsecret12345678901234567890
      - DB_CONNECTION_STRING=postgresql+psycopg://notifuser:notifpass@postgres:5432/notifdb
    ports:
      - "8000:8000"

volumes:
  postgres_data_test:
